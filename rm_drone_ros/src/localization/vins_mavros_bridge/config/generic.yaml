# Generic template for a VIO that publishes PoseStamped only.
#
# PoseStamped carries no velocity, so the bridge publishes zero twist and
# downstream consumers see a position-only estimate. px4ctrl's velocity
# feedback term and EGO-Planner's initial-state estimate both degrade in this
# mode; prefer a full Odometry source for flight.

input_mode: pose_stamped
input_topic: /vio/pose
input_child_frame: camera_link
input_twist_frame: world
input_twist_angular: false

base_to_input_xyz: [0.0, 0.0, 0.0]
base_to_input_rpy_deg: [0.0, 0.0, 0.0]

world_frame: world
body_frame: base_link

odometry_topic: /localization/odometry
publish_vision_pose: true
publish_mavros_odometry: false
publish_tf: false

input_timeout: 0.5
max_jump_m: 1.0
max_jump_deg: 30.0
jump_action: reject
recovery_frames: 5

output_rate: 0.0
max_republish_age: 0.2
path_rate: 1.0
path_max_poses: 1000

pose_covariance_floor: [0.0025, 0.0025, 0.0025, 0.0004, 0.0004, 0.0004]
twist_covariance_floor: [0.01, 0.01, 0.01, 0.001, 0.001, 0.001]

consistency_check: true
px4_odom_topic: /mavros/local_position/odom
consistency_tolerance: 1.0
