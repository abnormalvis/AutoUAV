# VINS-Fusion (/vins_estimator/odometry) adapter.
#
# Field semantics, read from the VINS-Fusion source rather than assumed. Every
# line below is a claim about vins_estimator/src/utility/visualization.cpp
# (pubOdometry) and vins_estimator/src/estimator/estimator.cpp.
#
#   pose            IMU frame in the world frame.
#                   Ps[WINDOW_SIZE] / Rs[WINDOW_SIZE].
#
#   twist.linear    WORLD frame. Vs is integrated as
#                     Vs[j] += dt * (Rs[j] * (a - ba) + g)
#                     Ps[j] += dt * Vs[j] + ...
#                   so it can only be a world-frame velocity. The visual-
#                   inertial initialiser rotates the body-frame solution into
#                   the world with Vs[i] = rot_diff * Vs[i].
#
#   twist.angular   NOT POPULATED. pubOdometry never writes
#                   odometry.twist.twist.angular, so it is structurally zero.
#                   Passing it through would tell EGO-Planner "not rotating"
#                   during every turn. Hence input_twist_angular: false.
#
#   covariance      NOT POPULATED either; all 36 bytes stay zero. The bridge's
#                   floor parameters are what make the output non-degenerate.
#
#   child_frame_id  "world" -- and that is a bug in VINS-Fusion. The pose it
#                   describes is the IMU frame. Setting input_child_frame to
#                   match the message would apply the extrinsic backwards, so
#                   the truthful frame is configured below and the mismatch
#                   warning is switched off.
#
# The published pose is the IMU frame ("body" in VINS-Fusion's TF tree), so
# base_to_input is IMU -> base_link.

input_mode: odometry
input_topic: /vins_estimator/odometry
input_child_frame: body
input_twist_frame: world
input_twist_angular: false
# input_twist_angular_frame is moot while input_twist_angular is false; VINS-Fusion
# would publish a body-frame rate if it published one at all.
input_twist_angular_frame: body
# VINS-Fusion emits nav_msgs/Odometry, so no differentiation is needed or wanted:
# the estimator's fused velocity is far better than a finite difference.
derive_twist: false
# Known-broken child_frame_id (see above). Do not silence this for other VIOs.
check_child_frame: false

# Where the VINS-Fusion IMU sits in base_link: [x, y, z] metres, then
# roll/pitch/yaw in degrees, ZYX order. PLACEHOLDER -- replace with a measured
# value. A wrong extrinsic biases every controller downstream with no warning.
base_to_input_xyz: [0.0, 0.0, 0.0]
base_to_input_rpy_deg: [0.0, 0.0, 0.0]

world_frame: world
body_frame: base_link

odometry_topic: /localization/odometry
publish_vision_pose: true
publish_mavros_odometry: false
publish_tf: false

input_timeout: 0.5
max_jump_m: 1.0
max_jump_deg: 30.0
jump_action: reject
recovery_frames: 5

output_rate: 0.0
max_republish_age: 0.2
path_rate: 1.0
path_max_poses: 1000

pose_covariance_floor: [0.0025, 0.0025, 0.0025, 0.0004, 0.0004, 0.0004]
twist_covariance_floor: [0.01, 0.01, 0.01, 0.001, 0.001, 0.001]

consistency_check: true
px4_odom_topic: /mavros/local_position/odom
consistency_tolerance: 1.0
