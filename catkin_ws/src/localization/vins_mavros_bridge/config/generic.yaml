# Generic template for a VIO that publishes PoseStamped only.
#
# PoseStamped carries no velocity, so the bridge differentiates the pose when
# derive_twist is set. That is a fallback, not a substitute: px4ctrl's velocity
# feedback term and EGO-Planner's initial-state estimate both degrade with a
# differentiated signal. Prefer a full Odometry source for flight.

input_mode: pose_stamped
input_topic: /vio/pose
input_child_frame: camera_link
input_twist_frame: world
input_twist_angular: false

# A PoseStamped has no velocity, so without this the output twist is identically
# zero and px4ctrl's velocity feedback sees a permanent false error. The derived
# twist is world-frame linear / body-frame angular over a 0.1 s window: it lags
# by about that window and should not be treated as a measurement. Set to false
# only if something downstream must see "no velocity" rather than "unknown".
derive_twist: true
twist_window: 0.10
twist_min_dt: 0.02

base_to_input_xyz: [0.0, 0.0, 0.0]
base_to_input_rpy_deg: [0.0, 0.0, 0.0]

world_frame: world
body_frame: base_link

odometry_topic: /localization/odometry
publish_vision_pose: true
publish_mavros_odometry: false
publish_tf: false

input_timeout: 0.5
max_jump_m: 1.0
max_jump_deg: 30.0
jump_action: reject
recovery_frames: 5

output_rate: 0.0
max_republish_age: 0.2
path_rate: 1.0
path_max_poses: 1000

pose_covariance_floor: [0.0025, 0.0025, 0.0025, 0.0004, 0.0004, 0.0004]
twist_covariance_floor: [0.01, 0.01, 0.01, 0.001, 0.001, 0.001]

consistency_check: true
px4_odom_topic: /mavros/local_position/odom
consistency_tolerance: 1.0
